<linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d94a35"/><stop offset="1" stop-color="#80241b"/></linearGradient>
<filter id="shadow" x="-20%" y="-30%" width="140%" height="175%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#060403" flood-opacity=".55"/></filter>
</defs>
