 </linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
  <stop stop-color="#FFE777"/><stop offset="1" stop-color="#E6AA32"/>
 </linearGradient>
</defs>
<!-- Símbolo compacto para manter leitura no celular -->
