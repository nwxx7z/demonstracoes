<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 98" fill="none" role="img" aria-labelledby="title desc">
<title id="title">O Buteco</title>
<desc id="desc">Marca horizontal do O Buteco, com caneca de chope, letras claras, amarelo-douradas e detalhe vermelho. Adaptada para o cabeçalho.</desc>
