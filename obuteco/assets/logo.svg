<text x="300" y="79" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="900" letter-spacing="3.5" fill="#62221a" text-anchor="middle" textLength="328" lengthAdjust="spacingAndGlyphs">CHOPERIA • PIZZARIA</text>
<text x="300" y="152" font-family="Georgia,'Times New Roman',serif" font-size="81" font-style="italic" font-weight="900" fill="#84291f" stroke="#fff3b9" stroke-width="2.5" paint-order="stroke" text-anchor="middle" textLength="394" lengthAdjust="spacingAndGlyphs">O Buteco</text>
<path d="M158 163Q300 176 442 163" stroke="#9c3925" stroke-width="4" stroke-linecap="round" fill="none"/>
</g></svg>